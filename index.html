<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Precision Benchmark Suite v2.1</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #1f2833;
      --accent-color: #66fcf1;
      --text-color: #c5c6c7;
      --highlight: #45a29e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      width: 100vw; height: 100vh;
      user-select: none;
    }

    .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    .active { display: flex !important; flex-direction: column; }

    /* 메인 메뉴 */
    #menu-view { align-items: center; justify-content: center; padding: 20px; }
    h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 6px; text-align: center; }
    .subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 25px; text-align: center; }
    
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 340px);
      gap: 16px;
    }
    .menu-btn {
      background: var(--card-bg);
      border: 2px solid var(--highlight);
      border-radius: 10px;
      color: #fff;
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background: var(--highlight);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 0 12px var(--accent-color);
    }
    .btn-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 6px; display: block; }
    .btn-desc { font-size: 0.8rem; color: #bbb; line-height: 1.3; }
    .menu-btn:hover .btn-desc { color: #111; }

    /* HUD */
    .hud {
      position: absolute;
      top: 15px; left: 15px;
      z-index: 100;
      background: rgba(31, 40, 51, 0.95);
      border: 1px solid var(--highlight);
      padding: 18px;
      border-radius: 8px;
      width: 360px;
      backdrop-filter: blur(4px);
    }
    .hud h3 { color: var(--accent-color); margin-bottom: 10px; border-bottom: 1px solid #444; padding-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .hud-info { font-size: 0.8rem; color: #aaa; margin-bottom: 14px; line-height: 1.35; }
    .hud-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.88rem; align-items: center; }
    .hud-val { color: var(--accent-color); font-weight: bold; }

    /* 진행률 바 */
    .timer-container { margin-bottom: 12px; }
    .progress-bar-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.05s linear; }

    .btn-back {
      margin-top: 14px; width: 100%; background: #c94c4c;
      color: white; border: none; padding: 10px; font-weight: bold;
      border-radius: 5px; cursor: pointer;
    }
    .btn-back:hover { background: #b03a3a; }

    /* 캔버스 */
    .test-area { flex: 1; width: 100%; height: 100%; background: #050505; }
    canvas { width: 100%; height: 100%; display: block; }

    /* 결과 모달 */
    #summary-modal {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: var(--card-bg); border: 2px solid var(--accent-color);
      padding: 24px; border-radius: 12px; z-index: 200; width: 90%; max-width: 540px; display: none;
      box-shadow: 0 0 30px rgba(102, 252, 241, 0.35);
    }
    .score-card {
      background: rgba(11, 12, 16, 0.8);
      border: 1px solid var(--highlight);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .score-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .score-card .title { font-weight: bold; color: #fff; font-size: 1rem; }
    .score-card .val { font-weight: bold; color: var(--accent-color); font-size: 1.2rem; }
    .score-details {
      display: flex; gap: 16px; font-size: 0.78rem; color: #aaa;
      border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 6px;
    }
    .score-details span { color: #e0e0e0; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 메인 메뉴 -->
  <div id="menu-view" class="view active">
    <h1>AP PRECISION BENCHMARK v2.1</h1>
    <div class="subtitle">고정 워크로드(Fixed Workload) 기반 고신뢰도 AP 정밀 측정 툴</div>
    
    <div class="menu-grid">
      <button class="menu-btn" data-mode="cpu">
        <span class="btn-title">💻 CPU 고정 부하 테스트</span>
        <span class="btn-desc">1,500만 회 연산 처리 소요 시간(ms)을 측정합니다.</span>
      </button>
      <button class="menu-btn" data-mode="gpu2d">
        <span class="btn-title">🎨 GPU 2D 물리 테스트</span>
        <span class="btn-desc">20,000개 파티클의 300 프레임 연산 속도를 검증합니다.</span>
      </button>
      <button class="menu-btn" data-mode="gpu3d">
        <span class="btn-title">🧊 GPU 3D 공간 렌더링</span>
        <span class="btn-desc">1,000개 큐브 오브젝트의 250 프레임 투영 처리 시간을 정밀 산출합니다.</span>
      </button>
      <button class="menu-btn" data-mode="npu">
        <span class="btn-title">🧠 NPU 신경망 추론</span>
        <span class="btn-desc">400만 회 딥러닝 활성화 연산 처리 시간을 계산합니다.</span>
      </button>
      <button class="menu-btn" style="grid-column: span 2; background: #254e58;" data-mode="full">
        <span class="btn-title" style="text-align: center;">⚡ 정밀 종합 테스트 (Full Suite)</span>
        <span class="btn-desc" style="text-align: center;">모든 고정 부하 세트를 순차 실행하여 항목별 정밀 스코어를 도출합니다.</span>
      </button>
    </div>
  </div>

  <!-- 테스트 진행 화면 -->
  <div id="test-view" class="view">
    <div class="hud">
      <h3>
        <span id="test-title">PRECISION TEST</span>
        <span id="status-badge" style="font-size:0.7rem; background:var(--highlight); color:#000; padding:2px 6px; border-radius:4px;">RUNNING</span>
      </h3>
      <div class="hud-info" id="test-desc">테스트 진척도를 실시간 측정 중입니다...</div>
      
      <div class="timer-container">
        <div class="hud-row"><span>진행률:</span> <span id="val-progress" class="hud-val">0%</span></div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
      </div>

      <div class="hud-row"><span>소요 시간:</span> <span id="val-time" class="hud-val">0 ms</span></div>
      <div class="hud-row"><span>처리 연산 속도:</span> <span id="val-speed" class="hud-val">--</span></div>
      <button class="btn-back" id="btn-exit">테스트 중단 및 메뉴로</button>
    </div>

    <div class="test-area">
      <canvas id="mainCanvas"></canvas>
    </div>
  </div>

  <!-- 결과 모달 -->
  <div id="summary-modal">
    <h2 style="color:var(--accent-color); text-align:center; margin-bottom:16px;">종합 AP 정밀 평가 결과 (v2.1)</h2>
    <div id="summary-content"></div>
    <div style="font-size:1.4rem; color:var(--accent-color); text-align:center; margin-top:14px; padding-top:10px; border-top:2px dashed var(--highlight); font-weight:bold;" id="total-score-val">
      TOTAL SCORE: 0 점
    </div>
    <button class="btn-back" style="margin-top:14px;" id="btn-close-summary">확인 및 메뉴로</button>
  </div>

  <script>
    let currentMode = null, isFullTest = false, fullTestIndex = 0;
    const fullSequence = ['cpu', 'gpu2d', 'gpu3d', 'npu'];

    const resultScores = {
      cpu: { score: 0, timeMs: 0, opsSec: 0 },
      gpu2d: { score: 0, timeMs: 0, fps: 0 },
      gpu3d: { score: 0, timeMs: 0, fps: 0 },
      npu: { score: 0, timeMs: 0, infSec: 0 }
    };

    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);

    document.querySelectorAll('.menu-btn').forEach(btn => {
      btn.addEventListener('click', () => startTest(btn.getAttribute('data-mode')));
    });

    document.getElementById('btn-exit').addEventListener('click', exitTest);
    document.getElementById('btn-close-summary').addEventListener('click', closeSummary);

    function nextFrame() {
      return new Promise(resolve => requestAnimationFrame(resolve));
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function startTest(mode) {
      currentMode = mode;
      isFullTest = (mode === 'full');
      if (isFullTest) { fullTestIndex = 0; currentMode = fullSequence[0]; }
      
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('test-view').classList.add('active');
      resizeCanvas();
      
      runBenchmarkStep();
    }

    function exitTest() {
      currentMode = null; isFullTest = false;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('menu-view').classList.add('active');
    }

    async function runBenchmarkStep() {
      document.getElementById('test-title').textContent = currentMode.toUpperCase() + " PRECISION TEST";
      document.getElementById('progress-bar').style.width = '0%';
      document.getElementById('val-progress').textContent = '0%';

      // 각 테스트 전 안정화
      await delay(200);

      if (currentMode === 'cpu') await runCPUBenchmark();
      else if (currentMode === 'gpu2d') await runGPU2DBenchmark();
      else if (currentMode === 'gpu3d') await runGPU3DBenchmark();
      else if (currentMode === 'npu') await runNPUBenchmark();

      await delay(300);

      if (isFullTest) {
        fullTestIndex++;
        if (fullTestIndex < fullSequence.length) {
          currentMode = fullSequence[fullTestIndex];
          runBenchmarkStep();
        } else {
          exitTest();
          showSummary();
        }
      } else {
        exitTest();
        showSummary();
      }
    }

    function updateProgress(percent, timeMs, speedText) {
      document.getElementById('progress-bar').style.width = Math.min(100, percent) + '%';
      document.getElementById('val-progress').textContent = Math.round(Math.min(100, percent)) + '%';
      document.getElementById('val-time').textContent = Math.round(timeMs) + ' ms';
      document.getElementById('val-speed').textContent = speedText;
    }

    // --- 1. CPU 고정 워크로드 테스트 ---
    async function runCPUBenchmark() {
      const TOTAL_OPS = 15000000;
      const CHUNK_SIZE = 250000;
      let completedOps = 0;

      const startTime = performance.now();

      while (completedOps < TOTAL_OPS) {
        for (let i = 0; i < CHUNK_SIZE; i++) {
          Math.sqrt(i) * Math.atan(i);
        }
        completedOps += CHUNK_SIZE;
        let elapsed = performance.now() - startTime;
        let opsSec = (completedOps / elapsed) * 1000;
        
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#66fcf1'; ctx.font = '22px sans-serif';
        ctx.fillText(`💻 CPU Multi-Math Test: ${(completedOps/1000000).toFixed(1)}M / 15M Ops`, 50, 100);

        updateProgress((completedOps / TOTAL_OPS) * 100, elapsed, (opsSec/1000000).toFixed(2) + ' M-Ops/s');
        await nextFrame();
      }

      const totalTime = performance.now() - startTime;
      const score = Math.round((15000000 / totalTime) * 15);
      resultScores.cpu = {
        score: score,
        timeMs: Math.round(totalTime),
        opsSec: Math.round((TOTAL_OPS / totalTime) * 1000)
      };
    }

    // --- 2. GPU 2D 고정 워크로드 테스트 ---
    async function runGPU2DBenchmark() {
      const PARTICLE_COUNT = 20000;
      const TOTAL_FRAMES = 300;
      
      let pX = new Float32Array(PARTICLE_COUNT), pY = new Float32Array(PARTICLE_COUNT);
      let pVX = new Float32Array(PARTICLE_COUNT), pVY = new Float32Array(PARTICLE_COUNT);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pX[i] = Math.random() * canvas.width; pY[i] = Math.random() * canvas.height;
        pVX[i] = (Math.random() - 0.5) * 6; pVY[i] = (Math.random() - 0.5) * 6;
      }

      const startTime = performance.now();

      for (let f = 0; f < TOTAL_FRAMES; f++) {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#66fcf1';

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          pX[i] += pVX[i]; pY[i] += pVY[i];
          if (pX[i] < 0 || pX[i] > canvas.width) pVX[i] *= -1;
          if (pY[i] < 0 || pY[i] > canvas.height) pVY[i] *= -1;
          ctx.fillRect(pX[i], pY[i], 1.5, 1.5);
        }

        let elapsed = performance.now() - startTime;
        let avgFps = (f + 1) / (elapsed / 1000);
        updateProgress(((f + 1) / TOTAL_FRAMES) * 100, elapsed, avgFps.toFixed(1) + ' FPS');

        await nextFrame();
      }

      const totalTime = performance.now() - startTime;
      const avgFps = Math.round((TOTAL_FRAMES / totalTime) * 1000);
      const score = Math.round((TOTAL_FRAMES * PARTICLE_COUNT) / totalTime * 10);

      resultScores.gpu2d = { score: score, timeMs: Math.round(totalTime), fps: avgFps };
    }

    // --- 3. GPU 3D 고정 워크로드 테스트 ---
    async function runGPU3DBenchmark() {
      const CUBE_COUNT = 1000;
      const TOTAL_FRAMES = 250;
      let cubes = [];

      for (let i = 0; i < CUBE_COUNT; i++) {
        cubes.push({
          x: (Math.random() - 0.5) * 800, y: (Math.random() - 0.5) * 800, z: Math.random() * 800 + 100,
          rx: Math.random() * Math.PI, ry: Math.random() * Math.PI
        });
      }

      const nodes = [[-10,-10,-10],[10,-10,-10],[10,10,-10],[-10,10,-10],[-10,-10,10],[10,-10,10],[10,10,10],[-10,10,10]];
      const edges = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

      const startTime = performance.now();

      for (let f = 0; f < TOTAL_FRAMES; f++) {
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#66fcf1'; ctx.lineWidth = 1;
        let cx = canvas.width / 2, cy = canvas.height / 2;

        for (let i = 0; i < CUBE_COUNT; i++) {
          let c = cubes[i];
          c.rx += 0.02; c.ry += 0.015;
          let projected = [];

          for (let j = 0; j < 8; j++) {
            let nx = nodes[j][0], ny = nodes[j][1], nz = nodes[j][2];
            let y1 = ny * Math.cos(c.rx) - nz * Math.sin(c.rx);
            let z1 = ny * Math.sin(c.rx) + nz * Math.cos(c.rx);
            let x2 = nx * Math.cos(c.ry) + z1 * Math.sin(c.ry);
            let z2 = -nx * Math.sin(c.ry) + z1 * Math.cos(c.ry);

            let px = (x2 + c.x) * (400 / (z2 + c.z)) + cx;
            let py = (y1 + c.y) * (400 / (z2 + c.z)) + cy;
            projected.push([px, py]);
          }

          ctx.beginPath();
          for (let e = 0; e < edges.length; e++) {
            let p1 = projected[edges[e][0]], p2 = projected[edges[e][1]];
            ctx.moveTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]);
          }
          ctx.stroke();
        }

        let elapsed = performance.now() - startTime;
        let avgFps = (f + 1) / (elapsed / 1000);
        updateProgress(((f + 1) / TOTAL_FRAMES) * 100, elapsed, avgFps.toFixed(1) + ' FPS');

        await nextFrame();
      }

      const totalTime = performance.now() - startTime;
      const avgFps = Math.round((TOTAL_FRAMES / totalTime) * 1000);
      const score = Math.round((TOTAL_FRAMES * CUBE_COUNT) / totalTime * 20);

      resultScores.gpu3d = { score: score, timeMs: Math.round(totalTime), fps: avgFps };
    }

    // --- 4. NPU 고정 워크로드 테스트 ---
    async function runNPUBenchmark() {
      const TOTAL_INFERS = 4000000;
      const CHUNK = 200000;
      let completed = 0;

      const startTime = performance.now();

      while (completed < TOTAL_INFERS) {
        for (let i = 0; i < CHUNK; i++) {
          Math.tanh(Math.sin(i));
        }
        completed += CHUNK;
        let elapsed = performance.now() - startTime;
        let infSec = (completed / elapsed) * 1000;

        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#66fcf1'; ctx.font = '22px sans-serif';
        ctx.fillText(`🧠 NPU Neural Activation Test: ${(completed/1000000).toFixed(2)}M / 4M Infers`, 50, 100);

        updateProgress((completed / TOTAL_INFERS) * 100, elapsed, (infSec/1000000).toFixed(2) + ' M-Inf/s');
        await nextFrame();
      }

      const totalTime = performance.now() - startTime;
      const score = Math.round((TOTAL_INFERS / totalTime) * 15);

      resultScores.npu = {
        score: score,
        timeMs: Math.round(totalTime),
        infSec: Math.round((TOTAL_INFERS / totalTime) * 1000)
      };
    }

    // 결과 출력
    function showSummary() {
      const modal = document.getElementById('summary-modal');
      const content = document.getElementById('summary-content');
      const d = resultScores;
      let total = d.cpu.score + d.gpu2d.score + d.gpu3d.score + d.npu.score;

      content.innerHTML = 
        '<div class="score-card">' +
          '<div class="score-card-header"><span class="title">💻 CPU (다중 정밀 연산)</span><span class="val">' + d.cpu.score.toLocaleString() + ' 점</span></div>' +
          '<div class="score-details">' +
            '<div>소요시간: <span>' + d.cpu.timeMs.toLocaleString() + ' ms</span></div>' +
            '<div>처리 속도: <span>' + (d.cpu.opsSec / 1000000).toFixed(2) + ' M-Ops/s</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="score-card">' +
          '<div class="score-card-header"><span class="title">🎨 GPU 2D (물리 파티클)</span><span class="val">' + d.gpu2d.score.toLocaleString() + ' 점</span></div>' +
          '<div class="score-details">' +
            '<div>소요시간: <span>' + d.gpu2d.timeMs.toLocaleString() + ' ms</span></div>' +
            '<div>평균 처리: <span>' + d.gpu2d.fps + ' FPS</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="score-card">' +
          '<div class="score-card-header"><span class="title">🧊 GPU 3D (공간 투영)</span><span class="val">' + d.gpu3d.score.toLocaleString() + ' 점</span></div>' +
          '<div class="score-details">' +
            '<div>소요시간: <span>' + d.gpu3d.timeMs.toLocaleString() + ' ms</span></div>' +
            '<div>평균 처리: <span>' + d.gpu3d.fps + ' FPS</span></div>' +
          '</div>' +
        '</div>' +

        '<div class="score-card">' +
          '<div class="score-card-header"><span class="title">🧠 NPU (신경망 추론)</span><span class="val">' + d.npu.score.toLocaleString() + ' 점</span></div>' +
          '<div class="score-details">' +
            '<div>소요시간: <span>' + d.npu.timeMs.toLocaleString() + ' ms</span></div>' +
            '<div>추론 속도: <span>' + (d.npu.infSec / 1000000).toFixed(2) + ' M-Inf/s</span></div>' +
          '</div>' +
        '</div>';
      
      document.getElementById('total-score-val').textContent = 'TOTAL SCORE: ' + total.toLocaleString() + ' 점';
      modal.style.display = 'block';
    }

    function closeSummary() {
      document.getElementById('summary-modal').style.display = 'none';
    }
  </script>
</body>
</html>
