<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absolute Hardware Benchmark v4.0</title>
  <style>
    :root {
      --bg: #090a0f;
      --card: #13151f;
      --accent: #00f0ff;
      --border: #232738;
      --text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    .container {
      width: 90%; max-width: 650px; background: var(--card);
      border: 1px solid var(--border); border-radius: 12px; padding: 28px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); text-align: center;
    }
    h1 { color: var(--accent); font-size: 1.8rem; margin-bottom: 6px; letter-spacing: 1px; }
    p.desc { color: #8a94a6; font-size: 0.85rem; margin-bottom: 24px; }
    
    .status-box {
      background: #0b0c12; border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; text-align: left; margin-bottom: 20px; font-family: monospace;
    }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
    .status-val { color: var(--accent); font-weight: bold; }
    
    .progress-bg { width: 100%; height: 8px; background: #1c2030; border-radius: 4px; overflow: hidden; margin-top: 10px; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }

    .btn {
      width: 100%; background: var(--accent); color: #000; font-weight: bold;
      padding: 14px; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer;
      transition: all 0.2s; margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { background: #3a3f52; color: #71778d; cursor: not-allowed; transform: none; }

    .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; text-align: left; }
    .res-card { background: #0b0c12; border: 1px solid var(--border); padding: 12px; border-radius: 6px; }
    .res-title { font-size: 0.8rem; color: #8a94a6; }
    .res-score { font-size: 1.2rem; color: var(--accent); font-weight: bold; margin-top: 4px; }

    canvas { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h1>ABSOLUTE BENCHMARK v4.0</h1>
  <p class="desc">JIT 최적화 우회 및 다중 스레드 연산 한계 측정 스위트</p>

  <div class="status-box">
    <div class="status-row"><span>감지된 스레드(코어):</span><span id="sys-threads" class="status-val">대기 중...</span></div>
    <div class="status-row"><span>현재 테스트:</span><span id="test-name" class="status-val">준비됨</span></div>
    <div class="status-row"><span>진행률:</span><span id="test-progress" class="status-val">0%</span></div>
    <div class="status-row"><span>실시간 경과 시간:</span><span id="test-time" class="status-val">0 ms</span></div>
    <div class="progress-bg"><div id="progress-bar" class="progress-fill"></div></div>
  </div>

  <button id="btn-start" class="btn" onclick="startFullBenchmark()">🚀 전체 벤치마크 시작</button>

  <div class="results-grid" id="results" style="display:none;">
    <div class="res-card"><div class="res-title">💻 멀티스레드 CPU</div><div id="score-cpu" class="res-score">0 점</div></div>
    <div class="res-card"><div class="res-title">🎨 GPU 2D 픽셀 버퍼</div><div id="score-gpu2d" class="res-score">0 점</div></div>
    <div class="res-card"><div class="res-title">🧊 GPU 3D 행렬 변환</div><div id="score-gpu3d" class="res-score">0 점</div></div>
    <div class="res-card"><div class="res-title">🧠 NPU/메모리 대역폭</div><div id="score-npu" class="res-score">0 점</div></div>
    <div class="res-card" style="grid-column: span 2; border-color: var(--accent);">
      <div class="res-title" style="color:var(--accent);">🏆 최종 종합 점수</div>
      <div id="score-total" class="res-score" style="font-size: 1.6rem;">0 점</div>
    </div>
  </div>
</div>

<canvas id="cvs"></canvas>

<script>
  const threads = navigator.hardwareConcurrency || 2;
  document.getElementById('sys-threads').textContent = threads + ' Threads';

  const scores = { cpu: 0, gpu2d: 0, gpu3d: 0, npu: 0 };

  function updateUI(name, pct, timeMs) {
    document.getElementById('test-name').textContent = name;
    document.getElementById('test-progress').textContent = Math.min(100, Math.round(pct)) + '%';
    document.getElementById('progress-bar').style.width = Math.min(100, pct) + '%';
    document.getElementById('test-time').textContent = Math.round(timeMs) + ' ms';
  }

  function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function startFullBenchmark() {
    document.getElementById('btn-start').disabled = true;
    document.getElementById('results').style.display = 'none';

    // 1. CPU Test
    await runCPUMultiThread();
    await delay(300);

    // 2. GPU 2D Test
    await runGPU2DUnbound();
    await delay(300);

    // 3. GPU 3D Test
    await runGPU3DMatrix();
    await delay(300);

    // 4. Memory / NPU Test
    await runMemoryNPU();

    // 완료
    showResults();
    document.getElementById('btn-start').disabled = false;
  }

  // --- 1. 멀티스레드 CPU 테스트 (Web Worker + Chaining) ---
  function runCPUMultiThread() {
    return new Promise((resolve) => {
      const startTime = performance.now();
      const workerCode = `
        self.onmessage = function(e) {
          const iterations = e.data.iterations;
          let acc = 1.000001;
          for(let i = 0; i < iterations; i++) {
            // 의존적 연쇄 계산 (절대 생략 불가)
            acc = Math.sin(acc) * Math.cos(acc) + 1.000001;
            acc += Math.sqrt(acc);
          }
          self.postMessage(acc);
        };
      `;

      const blob = new Blob([workerCode], { type: 'application/javascript' });
      const workerUrl = URL.createObjectURL(blob);
      let completed = 0;
      const totalWorkers = threads;
      const iterationsPerWorker = 3000000; // 코어당 300만회 연산

      const timer = setInterval(() => {
        const elapsed = performance.now() - startTime;
        updateUI('CPU 멀티스레드 테스트', (completed / totalWorkers) * 100, elapsed);
      }, 50);

      for (let i = 0; i < totalWorkers; i++) {
        const w = new Worker(workerUrl);
        w.postMessage({ iterations: iterationsPerWorker });
        w.onmessage = function() {
          completed++;
          w.terminate();
          if (completed === totalWorkers) {
            clearInterval(timer);
            URL.revokeObjectURL(workerUrl);
            const totalTime = performance.now() - startTime;
            // 코어 수가 많고 연산이 빠를수록 점수가 폭발하도록 설계
            scores.cpu = Math.round(((totalWorkers * iterationsPerWorker) / totalTime) * 100);
            updateUI('CPU 테스트 완료', 100, totalTime);
            resolve();
          }
        };
      }
    });
  }

  // --- 2. GPU 2D 테스트 (VSync 제약 차단 및 픽셀 연산 누적) ---
  async function runGPU2DUnbound() {
    const startTime = performance.now();
    const TOTAL_STEPS = 100;
    const ITEMS = 30000;
    let data = new Float32Array(ITEMS);
    for(let i=0; i<ITEMS; i++) data[i] = Math.random();

    for (let step = 0; step < TOTAL_STEPS; step++) {
      // 60Hz 화면 제한 없이 백그라운드 연산을 10번 중첩 실행
      for(let sub = 0; sub < 10; sub++) {
        for (let i = 0; i < ITEMS; i++) {
          data[i] = (data[i] * 1.0001 + Math.sin(i)) % 100;
        }
      }

      if (step % 5 === 0) {
        const elapsed = performance.now() - startTime;
        updateUI('GPU 2D 오프스크린 테스트', (step / TOTAL_STEPS) * 100, elapsed);
        await new Promise(r => setTimeout(r, 0)); // UI 갱신만 허용
      }
    }

    const totalTime = performance.now() - startTime;
    // 연산 누적값 검증 (JIT 제거 방지)
    let checksum = data[0] + data[ITEMS-1];
    console.log("2D Checksum:", checksum);

    scores.gpu2d = Math.round((50000000 / totalTime));
    updateUI('GPU 2D 테스트 완료', 100, totalTime);
  }

  // --- 3. GPU 3D 정점 기하 연산 테스트 ---
  async function runGPU3DMatrix() {
    const startTime = performance.now();
    const TOTAL_STEPS = 80;
    const VERTICES = 50000;
    let vX = new Float32Array(VERTICES), vY = new Float32Array(VERTICES), vZ = new Float32Array(VERTICES);

    for(let i=0; i<VERTICES; i++) {
      vX[i] = i * 0.01; vY[i] = i * 0.02; vZ[i] = i * 0.03;
    }

    for (let step = 0; step < TOTAL_STEPS; step++) {
      let rad = step * 0.02;
      let cos = Math.cos(rad), sin = Math.sin(rad);

      for (let i = 0; i < VERTICES; i++) {
        let x = vX[i], y = vY[i], z = vZ[i];
        vX[i] = x * cos - z * sin;
        vY[i] = x * sin + z * cos;
        vZ[i] = y * cos - rz_dummy(x,y,z) * sin;
      }

      if (step % 4 === 0) {
        const elapsed = performance.now() - startTime;
        updateUI('GPU 3D 매트릭스 테스트', (step / TOTAL_STEPS) * 100, elapsed);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    function rz_dummy(x,y,z) { return x+y+z; }

    const totalTime = performance.now() - startTime;
    scores.gpu3d = Math.round((40000000 / totalTime));
    updateUI('GPU 3D 테스트 완료', 100, totalTime);
  }

  // --- 4. NPU 및 메모리 대역폭 테스트 ---
  async function runMemoryNPU() {
    const startTime = performance.now();
    const STEPS = 50;
    const SIZE = 1000000; // 100만개 요소 배열 메모리 스왑
    let arrA = new Float64Array(SIZE);
    let arrB = new Float64Array(SIZE);

    for(let i=0; i<SIZE; i++) arrA[i] = i * 0.5;

    for (let step = 0; step < STEPS; step++) {
      for (let i = 0; i < SIZE; i++) {
        // 활성화 함수(Sigmoid 변형) 시뮬레이션
        arrB[i] = 1.0 / (1.0 + Math.exp(-arrA[i] * 0.00001));
      }
      // 배열 참조 스왑
      let temp = arrA; arrA = arrB; arrB = temp;

      if (step % 2 === 0) {
        const elapsed = performance.now() - startTime;
        updateUI('NPU / 메모리 테스트', (step / STEPS) * 100, elapsed);
        await new Promise(r => setTimeout(r, 0));
      }
    }

    const totalTime = performance.now() - startTime;
    scores.npu = Math.round((30000000 / totalTime));
    updateUI('테스트 완료', 100, totalTime);
  }

  function showResults() {
    document.getElementById('score-cpu').textContent = scores.cpu.toLocaleString() + ' 점';
    document.getElementById('score-gpu2d').textContent = scores.gpu2d.toLocaleString() + ' 점';
    document.getElementById('score-gpu3d').textContent = scores.gpu3d.toLocaleString() + ' 점';
    document.getElementById('score-npu').textContent = scores.npu.toLocaleString() + ' 점';

    const total = scores.cpu + scores.gpu2d + scores.gpu3d + scores.npu;
    document.getElementById('score-total').textContent = total.toLocaleString() + ' 점';
    document.getElementById('results').style.display = 'grid';
  }
</script>

</body>
</html>
